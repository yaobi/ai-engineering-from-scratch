[project]
name = "my-ai-practice-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "jupyterlab>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
torch = [
    "torch",
    "torchvision",
    "torchaudio",
]

llm = [
    "openai>=1.0",
    "anthropic>=0.39",
]
